server.address=${ELEPAY_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${ELEPAY_DB_URL:jdbc:postgresql://localhost:5432/elepay_sandbox}
spring.datasource.username=${ELEPAY_DB_USER:elepay}
spring.datasource.password=${ELEPAY_DB_PASSWORD}
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

# HikariCP Production Connection Pool & High Availability
spring.datasource.hikari.pool-name=ElepayHikariPool
spring.datasource.hikari.maximum-pool-size=${ELEPAY_DB_POOL_MAX:50}
spring.datasource.hikari.minimum-idle=${ELEPAY_DB_POOL_MIN:10}
spring.datasource.hikari.idle-timeout=${ELEPAY_DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${ELEPAY_DB_POOL_CONN_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${ELEPAY_DB_POOL_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${ELEPAY_DB_LEAK_DETECTION_MS:60000}
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=3000

# Redis Distributed Cache, Lock and Rate Limiting
spring.data.redis.host=${ELEPAY_REDIS_HOST:localhost}
spring.data.redis.port=${ELEPAY_REDIS_PORT:6379}
spring.data.redis.password=${ELEPAY_REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# Observability and Probes
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true

# Security & Request Signing
# No default: an empty value means only per-API-key signing secrets are accepted.
elepay.security.signing-secret=${ELEPAY_SIGNING_SECRET:}
elepay.security.request-signing.enforce=${ELEPAY_ENFORCE_REQUEST_SIGNING:false}

elepay.public-base-url=${ELEPAY_PUBLIC_BASE_URL:http://127.0.0.1:8080}
elepay.outbox.enabled=${ELEPAY_OUTBOX_ENABLED:true}
elepay.outbox.poll-ms=1000
# Simulated money is off unless a non-production profile turns it on.
elepay.rails.sandbox.enabled=${ELEPAY_SANDBOX_ENABLED:false}
# Card vault key: base64 of 32 random bytes (openssl rand -base64 32). Required; no default.
elepay.vault.master-key=${ELEPAY_VAULT_MASTER_KEY:}
# Historical card token decryption: optional key supplied ONLY for a controlled migration.
# Never set a fallback or check the historic key into Git; rotate after re-encrypting records.
elepay.vault.legacy-master-key=${ELEPAY_VAULT_LEGACY_MASTER_KEY:}
# Tamper evidence (audit chain, snapshots, signed checkpoints). Generate with IntegrityKeys.main.
elepay.integrity.mac-key=${ELEPAY_INTEGRITY_MAC_KEY:}
elepay.integrity.previous-mac-keys=${ELEPAY_INTEGRITY_PREVIOUS_MAC_KEYS:}
elepay.integrity.ed25519-private-key=${ELEPAY_INTEGRITY_ED25519_KEY:}
elepay.integrity.mldsa65-private-key=${ELEPAY_INTEGRITY_MLDSA65_KEY:}
# Webhooks and other outbound calls: HTTPS to public hosts only.
elepay.outbound.allow-http=false
elepay.outbound.allow-private-hosts=false
# Optional egress-proxy ranges, for example 198.18.0.0/15. Empty keeps the SSRF checks unchanged.
elepay.outbound.allowed-cidrs=${ELEPAY_OUTBOUND_ALLOWED_CIDRS:}
# Scoped partner/system egress allowlist (OutboundUrlGuard.validatePartnerEgress) for internal/partner
# rail and partner-API calls ONLY. It does NOT constrain merchant webhook delivery, which keeps just the
# always-on SSRF guard. Do not enable strict-allowlist globally; that would also block merchant webhooks.
elepay.outbound.partner-egress.allowed-hosts=${ELEPAY_PARTNER_EGRESS_HOSTS:custodian.gcb.com.gh,custodian.ecobank.com.gh,custodian.stanbic.com.gh,proxy.momoapi.mtn.com,momoapi.momo.africa,api.telecelcash.com.gh,openapi.telecel.com.gh,api.airteltigomoney.com.gh,openapi.at.com.gh,gip.ghipss.com,api.ghipss.com,switch.ghipss.com,api.emtech.com}
# Mobile TLS certificate pins (MobileCertificatePinningService). Empty = no-op (no enforcement), never
# hardcode certificates. Format: host|SPKI_SHA256_BASE64|PRIMARY|<ISO-8601 expiry>;host|...|BACKUP|...
elepay.mobile.cert-pinning.pins=${ELEPAY_MOBILE_CERT_PINS:}
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.elepay
springdoc.paths-to-match=/v1/**

# Operational artifacts default to the production security profile.
spring.profiles.default=prod

# Direct MTN Ghana connection: explicit opt-in after onboarding. No bundled credentials or default host.
elepay.rails.mtn.enabled=${ELEPAY_MTN_ENABLED:false}
elepay.rails.mtn.base-url=${ELEPAY_MTN_BASE_URL:}
elepay.rails.mtn.collection-user=${ELEPAY_MTN_COLLECTION_USER:}
elepay.rails.mtn.collection-key=${ELEPAY_MTN_COLLECTION_KEY:}
elepay.rails.mtn.collection-subscription=${ELEPAY_MTN_COLLECTION_SUBSCRIPTION:}
elepay.rails.mtn.disbursement-user=${ELEPAY_MTN_DISBURSEMENT_USER:}
elepay.rails.mtn.disbursement-key=${ELEPAY_MTN_DISBURSEMENT_KEY:}
elepay.rails.mtn.disbursement-subscription=${ELEPAY_MTN_DISBURSEMENT_SUBSCRIPTION:}
# Explicit contractual fee schedule required when MTN is enabled.
elepay.rails.mtn.fee-bps=${ELEPAY_MTN_FEE_BPS:-1}
elepay.rails.mtn.fee-cap-minor=${ELEPAY_MTN_FEE_CAP_MINOR:-1}

# Direct Telecel Cash Ghana connection
elepay.rails.telecel.enabled=${ELEPAY_TELECEL_ENABLED:false}
elepay.rails.telecel.base-url=${ELEPAY_TELECEL_BASE_URL:}
elepay.rails.telecel.client-id=${ELEPAY_TELECEL_CLIENT_ID:}
elepay.rails.telecel.client-secret=${ELEPAY_TELECEL_CLIENT_SECRET:}
elepay.rails.telecel.merchant-id=${ELEPAY_TELECEL_MERCHANT_ID:}
elepay.rails.telecel.webhook-secret=${ELEPAY_TELECEL_WEBHOOK_SECRET:}

# Direct AirtelTigo (AT Money) Ghana connection
elepay.rails.airteltigo.enabled=${ELEPAY_AIRTELTIGO_ENABLED:false}
elepay.rails.airteltigo.base-url=${ELEPAY_AIRTELTIGO_BASE_URL:}
elepay.rails.airteltigo.client-id=${ELEPAY_AIRTELTIGO_CLIENT_ID:}
elepay.rails.airteltigo.client-secret=${ELEPAY_AIRTELTIGO_CLIENT_SECRET:}
elepay.rails.airteltigo.merchant-id=${ELEPAY_AIRTELTIGO_MERCHANT_ID:}
elepay.rails.airteltigo.webhook-secret=${ELEPAY_AIRTELTIGO_WEBHOOK_SECRET:}

# Destination confirmation, wallet limits and dual control. Tests relax these in application-test.properties.
elepay.security.destination-cooling-off-hours=${ELEPAY_DESTINATION_COOLING_OFF_HOURS:24}
elepay.security.destination-oob-required=true
elepay.security.destination-name-match-required=true
elepay.security.dual-control.enforced=true
elepay.security.large-payout-pesewas=5000000
elepay.security.trusted-proxies=${ELEPAY_TRUSTED_PROXIES:}
elepay.wallet.require-recipient-confirmation=true
elepay.wallet.topup-own-msisdn-only=true
elepay.pos.dukpt.bdk-hex=${ELEPAY_POS_DUKPT_BDK:}

# Direct GhIPSS Instant Pay (GIP) & GhQR connection
elepay.rails.ghipss.enabled=${ELEPAY_GHIPSS_ENABLED:false}
elepay.rails.ghipss.base-url=${ELEPAY_GHIPSS_BASE_URL:}
elepay.rails.ghipss.institution-code=${ELEPAY_GHIPSS_INSTITUTION_CODE:}
elepay.rails.ghipss.api-key=${ELEPAY_GHIPSS_API_KEY:}
elepay.rails.ghipss.signing-secret=${ELEPAY_GHIPSS_SIGNING_SECRET:}
elepay.rails.ghipss.webhook-secret=${ELEPAY_GHIPSS_WEBHOOK_SECRET:}

# Emtech Payment Service regulatory reporting. Off until compliance turns it on.
# Credentials come from the environment only. There is no default client id or secret.
# ELEPAY e-money has no Emtech account-type value; leave the classification empty until
# compliance sets ELEPAY_EMTECH_EMONEY_ACCOUNT_TYPE to one of the six allowed values.
elepay.emtech.enabled=${ELEPAY_EMTECH_ENABLED:false}
elepay.emtech.base-url=${ELEPAY_EMTECH_BASE_URL:}
elepay.emtech.client-id=${ELEPAY_EMTECH_CLIENT_ID:}
elepay.emtech.client-secret=${ELEPAY_EMTECH_CLIENT_SECRET:}
elepay.emtech.connect-timeout=5s
elepay.emtech.read-timeout=15s
elepay.emtech.max-retries=${ELEPAY_EMTECH_MAX_RETRIES:3}
elepay.emtech.retry-base-ms=${ELEPAY_EMTECH_RETRY_BASE_MS:500}
elepay.emtech.max-attempts=${ELEPAY_EMTECH_MAX_ATTEMPTS:8}
elepay.emtech.poll-ms=${ELEPAY_EMTECH_POLL_MS:5000}
# Wait after process start before the first Emtech poll, so startup is not a send burst.
elepay.emtech.poll-initial-delay-ms=${ELEPAY_EMTECH_POLL_INITIAL_DELAY_MS:15000}
elepay.emtech.emoney-account-type=${ELEPAY_EMTECH_EMONEY_ACCOUNT_TYPE:}
# Registered location of the platform channel device (web, app, USSD wallet transfers).
# This is the institution's channel gateway, not a customer's location.
elepay.emtech.platform-city=${ELEPAY_EMTECH_PLATFORM_CITY:Accra}
elepay.emtech.platform-region=${ELEPAY_EMTECH_PLATFORM_REGION:GH-AA}
elepay.emtech.platform-country=${ELEPAY_EMTECH_PLATFORM_COUNTRY:GH}
elepay.emtech.platform-latitude=${ELEPAY_EMTECH_PLATFORM_LATITUDE:5.603717}
elepay.emtech.platform-longitude=${ELEPAY_EMTECH_PLATFORM_LONGITUDE:-0.186964}
elepay.emtech.coarse-ip-cities=${ELEPAY_EMTECH_COARSE_IP_CITIES:}


# ---- Connection-level hardening (slowloris, header floods, oversized requests) ----
# Drop clients that open a connection and send nothing / trickle bytes.
server.tomcat.connection-timeout=${ELEPAY_HTTP_CONNECTION_TIMEOUT:10s}
server.tomcat.keep-alive-timeout=${ELEPAY_HTTP_KEEPALIVE_TIMEOUT:15s}
server.tomcat.max-keep-alive-requests=${ELEPAY_HTTP_MAX_KEEPALIVE_REQUESTS:200}
# Bound open sockets per instance; beyond this the OS backlog (accept-count) queues briefly, then refuses.
server.tomcat.max-connections=${ELEPAY_HTTP_MAX_CONNECTIONS:8192}
server.tomcat.accept-count=${ELEPAY_HTTP_ACCEPT_COUNT:200}
server.max-http-request-header-size=16KB
server.tomcat.max-http-response-header-size=16KB
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
server.tomcat.max-parameter-count=200
server.tomcat.max-part-count=10
server.tomcat.reject-illegal-header=true

# ---- Application-layer DDoS defence (EdgeProtectionFilter, AbusePenaltyBox) ----
elepay.edge.enabled=${ELEPAY_EDGE_ENABLED:true}
elepay.edge.max-body-bytes=${ELEPAY_EDGE_MAX_BODY_BYTES:1048576}
elepay.edge.max-uri-length=2048
# Per client address across all routes. Generous because Ghanaian carriers share IPs (CGNAT).
elepay.edge.per-client.burst=${ELEPAY_EDGE_CLIENT_BURST:300}
elepay.edge.per-client.per-minute=${ELEPAY_EDGE_CLIENT_PER_MINUTE:1200}
# Requests in flight per instance before fast 503 load shedding; keep a small multiple of the DB pool.
elepay.edge.max-in-flight=${ELEPAY_EDGE_MAX_IN_FLIGHT:400}
elepay.edge.admission-wait-ms=50
elepay.abuse.enabled=${ELEPAY_ABUSE_ENABLED:true}
elepay.abuse.strike-threshold=${ELEPAY_ABUSE_STRIKE_THRESHOLD:60}
elepay.abuse.window-seconds=600
# Comma-separated IPs/CIDRs never banned (partner callback ranges, monitoring). Literals only.
elepay.abuse.exempt-addresses=${ELEPAY_ABUSE_EXEMPT_ADDRESSES:}

# ---- Real-time incident alerts (Slack / PagerDuty / Telegram / ops webhook) ----
elepay.alerts.webhook-url=${ELEPAY_ALERTS_WEBHOOK_URL:}
