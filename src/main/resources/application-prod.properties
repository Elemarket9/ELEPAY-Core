# Production: tokens from the configured OIDC issuer; listen on all interfaces behind TLS-terminating ingress.
server.address=0.0.0.0
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ELEPAY_OIDC_ISSUER}
# Tokens must be issued for ELEPAY, not just by the right issuer (OWASP ASVS: token audience).
spring.security.oauth2.resourceserver.jwt.audiences=${ELEPAY_OIDC_AUDIENCE}
# Trust X-Forwarded-* only from internal proxies (Tomcat RemoteIpValve); clients cannot spoof their IP or host.
server.forward-headers-strategy=native
# Never put stack traces or exception messages in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
# Metrics and probes on a separate port bound to loopback unless an internal address is set.
# Do not publish port 9090 on a public interface.
management.server.port=${ELEPAY_MANAGEMENT_PORT:9090}
management.server.address=${ELEPAY_MANAGEMENT_ADDRESS:127.0.0.1}
logging.structured.format.console=ecs

# Production Security & HA
elepay.security.request-signing.enforce=${ELEPAY_ENFORCE_REQUEST_SIGNING:true}
elepay.datasource.read-write-split.enabled=${ELEPAY_DB_READ_WRITE_SPLIT_ENABLED:false}

# Production requires nonce-bound signatures for authenticated merchant API mutations.
elepay.security.request-signing.require-v2=true

# Abuse limits must remain cluster-wide even during a Redis outage.
elepay.rate-limits.shared-required=true
