# Production: tokens from the configured OIDC issuer; listen on all interfaces behind TLS-terminating ingress.
server.address=0.0.0.0
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ELEPAY_OIDC_ISSUER}
# Tokens must be issued for ELEPAY, not just by the right issuer (OWASP ASVS: token audience).
spring.security.oauth2.resourceserver.jwt.audiences=${ELEPAY_OIDC_AUDIENCE}
# Trust X-Forwarded-* only from internal proxies (Tomcat RemoteIpValve); clients cannot spoof their IP or host.
server.forward-headers-strategy=native
# Never put stack traces or exception messages in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
# Metrics and probes on a separate port bound to loopback unless an internal address is set.
# Do not publish port 9090 on a public interface.
management.server.port=${ELEPAY_MANAGEMENT_PORT:9090}
management.server.address=${ELEPAY_MANAGEMENT_ADDRESS:127.0.0.1}
logging.structured.format.console=ecs

# Explicit environment anchor. ProductionSafetyCheck fails closed unless this is 'production' AND no
# sandbox/dev/test Spring profile is active, so flipping a profile cannot silently drop the guardrails.
elepay.environment=production

# Scoped partner/system egress allowlist (required in production; see application.properties for scope).
# Merchant webhook delivery is NOT constrained by this list.
elepay.outbound.partner-egress.allowed-hosts=${ELEPAY_PARTNER_EGRESS_HOSTS:custodian.gcb.com.gh,custodian.ecobank.com.gh,custodian.stanbic.com.gh,proxy.momoapi.mtn.com,momoapi.momo.africa,api.telecelcash.com.gh,openapi.telecel.com.gh,api.airteltigomoney.com.gh,openapi.at.com.gh,gip.ghipss.com,api.ghipss.com,switch.ghipss.com}
elepay.emtech.enabled=false

# Production Security & HA
elepay.security.request-signing.enforce=${ELEPAY_ENFORCE_REQUEST_SIGNING:true}
elepay.datasource.read-write-split.enabled=${ELEPAY_DB_READ_WRITE_SPLIT_ENABLED:false}

# Production requires nonce-bound signatures for authenticated merchant API mutations.
elepay.security.request-signing.require-v2=true

# Abuse limits must remain cluster-wide even during a Redis outage.
elepay.rate-limits.shared-required=true

# Do not expose OpenAPI specs, Swagger UI, or detailed health internals publicly in production.
springdoc.api-docs.enabled=${ELEPAY_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${ELEPAY_SWAGGER_UI_ENABLED:false}
management.endpoint.health.show-details=never

# Defense-in-depth pins: production must never run simulated rails, dormant modules, or destructive Flyway modes.
elepay.rails.sandbox.enabled=false
elepay.dormant-modules.enabled=false
elepay.stage1.strict-kill-switch-enabled=true
elepay.stage1.module.pos.enabled=false
elepay.stage1.module.fx.enabled=false
elepay.stage1.module.consumer-wallet.enabled=false
elepay.stage1.module.ussd.enabled=false
elepay.stage1.module.mandates.enabled=false
elepay.stage1.module.restaurant.enabled=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

