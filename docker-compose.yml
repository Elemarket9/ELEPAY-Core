# Local sandbox stack: PostgreSQL 18, Redis 7, and ELEPAY with simulated rails and development tokens.
# Never use these profiles or credentials with real money.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: elepay
      POSTGRES_USER: elepay
      POSTGRES_PASSWORD: ${ELEPAY_DB_PASSWORD:-local-sandbox-only}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elepay -d elepay"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  elepay:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: sandbox,dev
      ELEPAY_BIND_ADDRESS: 0.0.0.0
      ELEPAY_MANAGEMENT_ADDRESS: 0.0.0.0
      ELEPAY_DB_URL: jdbc:postgresql://postgres:5432/elepay
      ELEPAY_DB_USER: elepay
      ELEPAY_DB_PASSWORD: ${ELEPAY_DB_PASSWORD:-local-sandbox-only}
      ELEPAY_REDIS_HOST: redis
      ELEPAY_REDIS_PORT: 6379
      ELEPAY_PUBLIC_BASE_URL: http://localhost:8080
      ELEPAY_SANDBOX_ENABLED: "true"
      ELEPAY_RAILS_DEFAULT: sandbox
      ELEPAY_SECURITY_DEV_JWT_SECRET: ${ELEPAY_DEV_JWT_SECRET:-sandbox-only-dev-secret-change-me-32bytes}
      ELEPAY_SIGNING_SECRET: ${ELEPAY_SIGNING_SECRET:-dev-only-signing-secret-change-me-32-bytes}
      ELEPAY_VAULT_MASTER_KEY: ${ELEPAY_VAULT_MASTER_KEY:-ZGV2LW9ubHktY2FyZC12YXVsdC1rZXktMzItYnl0ZXM=}
      ELEPAY_INTEGRITY_MAC_KEY: ${ELEPAY_INTEGRITY_MAC_KEY:-ZGV2LW9ubHktaW50ZWdyaXR5LW1hYy1rZXktZm9yLWF1ZGl0LWNoYWluLTY0LWJ5dGVzLWxvbmctZGF0YSE=}
      ELEPAY_INTEGRITY_ALLOW_EPHEMERAL_SIGNING_KEYS: "true"
      ELEPAY_USSD_GENERIC_SECRET: ${ELEPAY_USSD_SECRET:-sandbox-ussd-secret}
      ELEPAY_OUTBOUND_ALLOW_HTTP: "true"
      ELEPAY_OUTBOUND_ALLOW_PRIVATE_HOSTS: "true"
      ELEPAY_WALLET_TOPUP_OWN_MSISDN_ONLY: "false"
      ELEPAY_WALLET_REQUIRE_RECIPIENT_CONFIRMATION: "false"
      ELEPAY_SECURITY_DESTINATION_OOB_REQUIRED: "false"
      ELEPAY_SECURITY_DESTINATION_NAME_MATCH_REQUIRED: "false"
      ELEPAY_SECURITY_DUAL_CONTROL_ENFORCED: "false"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  redisdata:
