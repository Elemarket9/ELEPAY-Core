name: EMTECH Live Sandbox Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Execute authenticated synthetic sandbox reporting
        env:
          ELEPAY_EMTECH_CLIENT_ID: ${{ secrets.ELEPAY_EMTECH_CLIENT_ID }}
          ELEPAY_EMTECH_CLIENT_SECRET: ${{ secrets.ELEPAY_EMTECH_CLIENT_SECRET }}
          ELEPAY_EMTECH_BASE_URL: ${{ vars.ELEPAY_EMTECH_BASE_URL }}
        run: |
          set -eu
          test -n "$ELEPAY_EMTECH_CLIENT_ID"
          test -n "$ELEPAY_EMTECH_CLIENT_SECRET"
          mvn -B -Dtest=EmtechSandboxLiveIT test
          test -s target/emtech-sandbox-live-summary.json
      - name: Retain sandbox acceptance evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emtech-live-sandbox-evidence
          path: target/emtech-sandbox-live-summary.json
          if-no-files-found: error
          retention-days: 7
