name: ELEPAY Core CI/CD & Security Verification
# Third-party actions are pinned to inspected upstream commits. Update SHAs deliberately.
on: [push, pull_request]
# One run per branch: push and PR events otherwise double the Maven Central traffic.
# New commits supersede the old jobs rather than keeping dozens of redundant scans alive.
concurrency:
  group: elepay-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  web:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security-scan:
    name: Security & Vulnerability Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Dependency vulnerability scan (OWASP Dependency-Check, fails on CVSS >= 5)
        run: mvn -B -Psecurity-scan -DskipTests verify
      - name: npm audit (web, high and critical)
        working-directory: web
        run: npm ci --no-fund && npm audit --audit-level=high
      - name: Secret scan (TruffleHog, verified secrets and source errors fail)
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # audited 2026-11-23
        with:
          version: '3.100.0'
          extra_args: --only-verified --fail-on-scan-errors

  backend-verify:
    name: Backend Test Suite & Modulith Verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: elepay_sandbox
          POSTGRES_USER: elepay
          POSTGRES_PASSWORD: sandbox-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elepay -d elepay_sandbox"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify fintech-only scope and reject fabricated financial actions
        run: python3 scripts/verify_fintech_scope.py
      # Run unit and integration test suite
      - name: Run Maven Tests & Verify
        env:
          ELEPAY_TEST_DB_URL: jdbc:postgresql://localhost:5432/elepay_sandbox
          ELEPAY_TEST_DB_USER: elepay
          ELEPAY_TEST_DB_PASSWORD: sandbox-ci-only
          ELEPAY_DB_URL: jdbc:postgresql://localhost:5432/elepay_sandbox
          ELEPAY_DB_USER: elepay
          ELEPAY_DB_PASSWORD: sandbox-ci-only
          ELEPAY_REDIS_HOST: localhost
          ELEPAY_REDIS_PORT: 6379
        run: mvn -B clean verify

      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyclonedx-sbom
          path: target/bom.json
          if-no-files-found: error

      - name: Verify production artifact contains no test payment implementations
        run: |
          jar tf target/elepay-core-0.1.0-SNAPSHOT.jar > jar-contents.txt
          if grep -E 'BOOT-INF/classes/(application-(dev|sandbox|test)\.properties|com/elepay/.*(Simulated|SandboxLedger|DevTokens|PaymentIntents|ThreeDSecureService|CardIssuingService|CardAuthorizationEngine|CompanyExpenseCardService|AgentCashInService|AgentCashOutService|AgentFloatService|AgentPortalService|AirtimeDataPurchaseEngine|UtilityPaymentService|SchoolFeePaymentService|ScheduledBillPaymentService|FaceMatchingLivenessService))' jar-contents.txt; then
            echo 'Test-only implementations are present in production artifact'; exit 1
          fi

      - name: Verify isolated test service & End-to-End Scenarios
        env:
          ELEPAY_DB_URL: jdbc:postgresql://localhost:5432/elepay_sandbox
          ELEPAY_DB_USER: elepay
          ELEPAY_DB_PASSWORD: sandbox-ci-only
          ELEPAY_REDIS_HOST: localhost
          ELEPAY_REDIS_PORT: 6379
          # Sandbox-only: acceptance flow withdraws to a freshly added destination.
          # Production keeps the 24h destination cooling-off default.
          ELEPAY_SECURITY_DESTINATION_COOLING_OFF_HOURS: '0'
        run: |
          mvn -B -Dspring-boot.run.profiles=sandbox,dev -Dspring-boot.run.main-class=com.elepay.SandboxApplication spring-boot:test-run > sandbox.log 2>&1 &
          pid=$!
          trap 'cat sandbox.log; kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/sandbox/balances/customer:readiness >/dev/null 2>&1; then
              python3 scripts/smoke.py
              python3 scripts/acceptance.py
              exit 0
            fi
            kill -0 "$pid" || exit 1
            sleep 1
          done
          exit 1

  container-build:
    name: Multi-stage Container Build & Packaging
    needs: [web, backend-verify, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Container Image
        run: |
          docker build -t elepay-core:ci-test .
          docker images elepay-core:ci-test

      - name: Validate Container Runs As Non-Root
        run: |
          USER_SPEC=$(docker inspect --format='{{.Config.User}}' elepay-core:ci-test)
          echo "Configured container user: ${USER_SPEC}"
          if [ "${USER_SPEC}" = "0" ] || [ "${USER_SPEC}" = "root" ] || [ -z "${USER_SPEC}" ]; then
            echo "SECURITY ERROR: Container is configured to run as root!" >&2
            exit 1
          fi
          RUNNING_UID=$(docker run --rm --entrypoint id elepay-core:ci-test -u)
          echo "Container runtime UID: ${RUNNING_UID}"
          if [ "${RUNNING_UID}" = "0" ]; then
            echo "SECURITY ERROR: Container executes as UID 0 (root)!" >&2
            exit 1
          fi
          echo "Non-root user validation passed (UID: ${RUNNING_UID}, Configured: ${USER_SPEC})"

      - name: Container commit-history secret scan (fail on source errors)
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # audited 2026-11-23
        with:
          version: '3.100.0'
          extra_args: --only-verified --fail-on-scan-errors

      - name: Verify scan gate rejects unreadable and zero-byte scans
        run: python3 -m unittest discover -s scripts -p 'test_assert_trufflehog_scan.py' -v

      - name: Scan actual packaged image for verified secrets (no empty-scan success)
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_PATH="${RUNNER_TEMP}/elepay-image-root"
          mkdir -p "${IMAGE_PATH}"
          CID=$(docker create elepay-core:ci-test)
          trap 'docker rm -f "${CID}" >/dev/null 2>&1 || true' EXIT
          docker export "${CID}" | tar -xf - -C "${IMAGE_PATH}"
          test -s "${IMAGE_PATH}/app/elepay.jar"
          docker run --rm -v "${IMAGE_PATH}:/image:ro" ghcr.io/trufflesecurity/trufflehog:3.100.0 \
            filesystem /image --only-verified --fail --fail-on-scan-errors --no-update \
            2>&1 | tee "${RUNNER_TEMP}/elepay-image-secret-scan.log"
          python3 scripts/assert_trufflehog_scan.py "${RUNNER_TEMP}/elepay-image-secret-scan.log"
