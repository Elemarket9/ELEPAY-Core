name: ELEPAY Core CI/CD & Security Verification
on: [push, pull_request]
permissions:
  contents: read
  security-events: write

jobs:
  web:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security-scan:
    name: Security & Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Dependency vulnerability scan (OWASP Dependency-Check, fails on CVSS >= 7)
        run: mvn -B -Psecurity-scan -DskipTests verify -DnvdApiKey=${{ secrets.NVD_API_KEY }}
      - name: npm audit (web, high and critical)
        working-directory: web
        run: npm ci --no-fund && npm audit --audit-level=high
      - name: Secret scan (TruffleHog, verified secrets fail the build)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  backend-verify:
    name: Backend Test Suite & Modulith Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: elepay_sandbox
          POSTGRES_USER: elepay
          POSTGRES_PASSWORD: sandbox-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elepay -d elepay_sandbox"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Run unit and integration test suite
      - name: Run Maven Tests & Verify
        env:
          ELEPAY_TEST_DB_URL: jdbc:postgresql://localhost:5432/elepay_sandbox
          ELEPAY_TEST_DB_USER: elepay
          ELEPAY_TEST_DB_PASSWORD: sandbox-ci-only
          ELEPAY_DB_URL: jdbc:postgresql://localhost:5432/elepay_sandbox
          ELEPAY_DB_USER: elepay
          ELEPAY_DB_PASSWORD: sandbox-ci-only
          ELEPAY_REDIS_HOST: localhost
          ELEPAY_REDIS_PORT: 6379
        run: mvn -B verify

      - name: Verify production artifact contains no test payment implementations
        run: |
          jar tf target/elepay-core-0.1.0-SNAPSHOT.jar > jar-contents.txt
          if grep -E 'BOOT-INF/classes/(application-(dev|sandbox|test)\.properties|com/elepay/.*(Simulated|SandboxLedger|DevTokens|PaymentIntents|ThreeDSecureService|CardIssuingService|CardAuthorizationEngine|CompanyExpenseCardService|AgentCashInService|AgentCashOutService|AgentFloatService|AgentPortalService|AirtimeDataPurchaseEngine|UtilityPaymentService|SchoolFeePaymentService|ScheduledBillPaymentService|FaceMatchingLivenessService))' jar-contents.txt; then
            echo 'Test-only implementations are present in production artifact'; exit 1
          fi

      - name: Verify isolated test service & End-to-End Scenarios
        env:
          ELEPAY_DB_URL: jdbc:postgresql://localhost:5432/elepay_sandbox
          ELEPAY_DB_USER: elepay
          ELEPAY_DB_PASSWORD: sandbox-ci-only
          ELEPAY_REDIS_HOST: localhost
          ELEPAY_REDIS_PORT: 6379
        run: |
          mvn -B -Dspring-boot.run.profiles=sandbox,dev -Dspring-boot.run.main-class=com.elepay.SandboxApplication spring-boot:test-run > sandbox.log 2>&1 &
          pid=$!
          trap 'cat sandbox.log; kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/sandbox/balances/customer:readiness >/dev/null 2>&1; then
              python3 scripts/smoke.py
              python3 scripts/acceptance.py
              exit 0
            fi
            kill -0 "$pid" || exit 1
            sleep 1
          done
          exit 1

  container-build:
    name: Multi-stage Container Build & Packaging
    needs: [web, backend-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Container Image
        run: |
          docker build -t elepay-core:ci-test .
          docker images elepay-core:ci-test
