name: Wallet sandbox
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: elepay_sandbox
          POSTGRES_USER: elepay
          POSTGRES_PASSWORD: sandbox-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elepay -d elepay_sandbox"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
      - name: Verify wallet flow
        env:
          ELEPAY_DB_PASSWORD: sandbox-ci-only
        run: |
          java -jar target/elepay-core-0.1.0-SNAPSHOT.jar --spring.profiles.active=sandbox > sandbox.log 2>&1 &
          pid=$!
          trap 'cat sandbox.log; kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/sandbox/balances/customer:readiness >/dev/null 2>&1; then
              python3 scripts/smoke.py
              exit
            fi
            kill -0 "$pid" || exit 1
            sleep 1
          done
          exit 1
