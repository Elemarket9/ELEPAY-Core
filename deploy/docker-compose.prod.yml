# Production deployment stack for ELEPAY-Core.
#
# Unlike the repo-root docker-compose.yml (local sandbox, simulated rails, dev tokens, default DB
# password), this file runs the real "prod" profile with NO default secrets. Every secret MUST be
# supplied via the environment (a secrets manager, Docker/Swarm/K8s secrets, or a CI-injected .env):
# the ":?" syntax makes the stack refuse to start if a required value is missing.
#
# Usage:
#   export ELEPAY_DB_PASSWORD=...  ELEPAY_OIDC_ISSUER=...  (and the rest below)
#   docker compose -f deploy/docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${ELEPAY_DB_NAME:?set me}
      POSTGRES_USER: ${ELEPAY_DB_USER:?set me}
      # No default: fail fast if the production DB password is not injected.
      POSTGRES_PASSWORD: ${ELEPAY_DB_PASSWORD:?set me}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    # Not published to the host: only the app on the internal_backend network reaches it.
    expose:
      - "5432"
    networks:
      - internal_backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis AUTH required in production; no default password.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${ELEPAY_REDIS_PASSWORD:?set me}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${ELEPAY_REDIS_PASSWORD:?set me}
    expose:
      - "6379"
    networks:
      - internal_backend
    restart: unless-stopped

  elepay:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_OIDC_ISSUER: ${ELEPAY_OIDC_ISSUER:?set me}
        VITE_OIDC_CLIENT_ID: ${ELEPAY_OIDC_CLIENT_ID:?set me}
    # Non-root runtime (uid 10001 defined in the Dockerfile).
    user: "10001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Real production profile. ProductionSafetyCheck fails closed unless elepay.environment=production
      # (set in application-prod.properties) AND no sandbox/dev/test profile is active.
      SPRING_PROFILES_ACTIVE: prod
      ELEPAY_BIND_ADDRESS: 0.0.0.0
      ELEPAY_DB_URL: jdbc:postgresql://postgres:5432/${ELEPAY_DB_NAME:?set me}
      ELEPAY_DB_USER: ${ELEPAY_DB_USER:?set me}
      ELEPAY_DB_PASSWORD: ${ELEPAY_DB_PASSWORD:?set me}
      ELEPAY_REDIS_HOST: redis
      ELEPAY_REDIS_PORT: "6379"
      ELEPAY_REDIS_PASSWORD: ${ELEPAY_REDIS_PASSWORD:?set me}
      ELEPAY_PUBLIC_BASE_URL: ${ELEPAY_PUBLIC_BASE_URL:?set me}
      # OIDC resource-server config (required by ProductionSafetyCheck).
      ELEPAY_OIDC_ISSUER: ${ELEPAY_OIDC_ISSUER:?set me}
      ELEPAY_OIDC_AUDIENCE: ${ELEPAY_OIDC_AUDIENCE:?set me}
      # Cryptographic material: inject from a KMS/secrets manager, never commit. base64 of 32 random bytes.
      ELEPAY_VAULT_MASTER_KEY: ${ELEPAY_VAULT_MASTER_KEY:?set me}
      ELEPAY_INTEGRITY_MAC_KEY: ${ELEPAY_INTEGRITY_MAC_KEY:?set me}
      ELEPAY_INTEGRITY_ED25519_KEY: ${ELEPAY_INTEGRITY_ED25519_KEY:?set me}
      ELEPAY_INTEGRITY_MLDSA65_KEY: ${ELEPAY_INTEGRITY_MLDSA65_KEY:?set me}
      ELEPAY_POS_DUKPT_BDK: ${ELEPAY_POS_DUKPT_BDK:?set me}
      ELEPAY_TRUSTED_PROXIES: ${ELEPAY_TRUSTED_PROXIES:?set me}
      # Explicit bank/network hosts supplied by the operator; never pass an empty override.
      ELEPAY_PARTNER_EGRESS_HOSTS: ${ELEPAY_PARTNER_EGRESS_HOSTS:?set verified provider hosts}
      # Explicitly pass approved rail configuration; every rail stays disabled until onboarding.
      ELEPAY_MTN_ENABLED: "${ELEPAY_MTN_ENABLED:-false}"
      ELEPAY_MTN_BASE_URL: "${ELEPAY_MTN_BASE_URL:-}"
      ELEPAY_MTN_COLLECTION_USER: "${ELEPAY_MTN_COLLECTION_USER:-}"
      ELEPAY_MTN_COLLECTION_KEY: "${ELEPAY_MTN_COLLECTION_KEY:-}"
      ELEPAY_MTN_COLLECTION_SUBSCRIPTION: "${ELEPAY_MTN_COLLECTION_SUBSCRIPTION:-}"
      ELEPAY_MTN_DISBURSEMENT_USER: "${ELEPAY_MTN_DISBURSEMENT_USER:-}"
      ELEPAY_MTN_DISBURSEMENT_KEY: "${ELEPAY_MTN_DISBURSEMENT_KEY:-}"
      ELEPAY_MTN_DISBURSEMENT_SUBSCRIPTION: "${ELEPAY_MTN_DISBURSEMENT_SUBSCRIPTION:-}"
      ELEPAY_TELECEL_ENABLED: "${ELEPAY_TELECEL_ENABLED:-false}"
      ELEPAY_TELECEL_BASE_URL: "${ELEPAY_TELECEL_BASE_URL:-}"
      ELEPAY_TELECEL_CLIENT_ID: "${ELEPAY_TELECEL_CLIENT_ID:-}"
      ELEPAY_TELECEL_CLIENT_SECRET: "${ELEPAY_TELECEL_CLIENT_SECRET:-}"
      ELEPAY_TELECEL_MERCHANT_ID: "${ELEPAY_TELECEL_MERCHANT_ID:-}"
      ELEPAY_TELECEL_WEBHOOK_SECRET: "${ELEPAY_TELECEL_WEBHOOK_SECRET:-}"
      ELEPAY_AIRTELTIGO_ENABLED: "${ELEPAY_AIRTELTIGO_ENABLED:-false}"
      ELEPAY_AIRTELTIGO_BASE_URL: "${ELEPAY_AIRTELTIGO_BASE_URL:-}"
      ELEPAY_AIRTELTIGO_CLIENT_ID: "${ELEPAY_AIRTELTIGO_CLIENT_ID:-}"
      ELEPAY_AIRTELTIGO_CLIENT_SECRET: "${ELEPAY_AIRTELTIGO_CLIENT_SECRET:-}"
      ELEPAY_AIRTELTIGO_MERCHANT_ID: "${ELEPAY_AIRTELTIGO_MERCHANT_ID:-}"
      ELEPAY_AIRTELTIGO_WEBHOOK_SECRET: "${ELEPAY_AIRTELTIGO_WEBHOOK_SECRET:-}"
      ELEPAY_GHIPSS_ENABLED: "${ELEPAY_GHIPSS_ENABLED:-false}"
      ELEPAY_GHIPSS_BASE_URL: "${ELEPAY_GHIPSS_BASE_URL:-}"
      ELEPAY_GHIPSS_INSTITUTION_CODE: "${ELEPAY_GHIPSS_INSTITUTION_CODE:-}"
      ELEPAY_GHIPSS_API_KEY: "${ELEPAY_GHIPSS_API_KEY:-}"
      ELEPAY_GHIPSS_SIGNING_SECRET: "${ELEPAY_GHIPSS_SIGNING_SECRET:-}"
      ELEPAY_GHIPSS_WEBHOOK_SECRET: "${ELEPAY_GHIPSS_WEBHOOK_SECRET:-}"
      ELEPAY_CARD_ENABLED: "${ELEPAY_CARD_ENABLED:-false}"
      ELEPAY_CARD_MODE: "${ELEPAY_CARD_MODE:-live}"
      ELEPAY_CARD_ACQUIRER_URL: "${ELEPAY_CARD_ACQUIRER_URL:-}"
      ELEPAY_CARD_ACQUIRER_ID: "${ELEPAY_CARD_ACQUIRER_ID:-}"
      ELEPAY_CARD_ACQUIRER_SECRET: "${ELEPAY_CARD_ACQUIRER_SECRET:-}"
      ELEPAY_CARD_WEBHOOK_SECRET: "${ELEPAY_CARD_WEBHOOK_SECRET:-}"
      # Optional mobile TLS pins (empty = no-op). Format documented in application.properties.
      ELEPAY_MOBILE_CERT_PINS: ${ELEPAY_MOBILE_CERT_PINS:-}
      # Management port (:9090) binds to loopback (127.0.0.1) by default so only the container-local
      # HEALTHCHECK can reach it. Never publish :9090 in `ports:`; only override to an internal
      # interface if an in-stack Prometheus scraper on `internal_backend` requires it.
      ELEPAY_MANAGEMENT_ADDRESS: ${ELEPAY_MANAGEMENT_ADDRESS:-127.0.0.1}
    ports:
      # Public API only. Management port 9090 is never published externally.
      - "8080:8080"
    networks:
      - internal_backend
      - edge_egress
    restart: unless-stopped

networks:
  internal_backend:
    # No external/internet routing; isolates Postgres, Redis, and internal-only management traffic.
    internal: true
  edge_egress:
    driver: bridge

volumes:
  pgdata:
  redisdata:
