# ELEPAY reference edge proxy (nginx >= 1.25). Sits behind the CDN/scrubbing provider and in front of the
# application instances. Every limit here is cheaper than the same rejection inside the JVM.
#
# Deploy notes:
#  - Only accept traffic from the CDN/scrubbing provider's published ranges (see allow list below) so the
#    origin cannot be hit directly. Keep the origin IP secret; rotate it if it leaks.
#  - set_real_ip_from must list exactly the CDN ranges, otherwise clients can spoof X-Forwarded-For.
#  - Tune rates with real traffic. Ghanaian carriers use CGNAT: one IP can be many customers.

worker_processes auto;
worker_rlimit_nofile 200000;
events { worker_connections 65536; multi_accept on; }

http {
    server_tokens off;

    # ---- real client IP from the CDN only (replace with your provider's ranges) ----
    # set_real_ip_from 173.245.48.0/20;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ---- slowloris / slow-body protection ----
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    keepalive_requests 200;
    reset_timedout_connection on;

    # ---- request shape limits (match the application: 1 MiB body, 16 KB headers) ----
    client_max_body_size 1m;
    client_body_buffer_size 64k;
    large_client_header_buffers 4 16k;

    # ---- rate and connection limits (shared memory zones; 10m holds ~160k addresses) ----
    limit_req_zone  $binary_remote_addr zone=per_ip:20m       rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=sensitive:10m    rate=30r/m;
    limit_req_zone  $http_x_elepay_api_key zone=per_key:20m   rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:20m;
    limit_req_status 429;
    limit_conn_status 429;

    # Drop requests with no Host / unknown Host before they reach upstream.
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    upstream elepay {
        least_conn;
        server app1:8080 max_fails=3 fail_timeout=10s;
        server app2:8080 max_fails=3 fail_timeout=10s;
        keepalive 256;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.elepay.example;   # replace

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        # ssl_certificate / ssl_certificate_key ...

        # HTTP/2 rapid-reset and stream-flood limits
        http2_max_concurrent_streams 64;

        limit_conn conn_per_ip 50;
        limit_req zone=per_ip burst=100 nodelay;

        # Only methods the API uses.
        if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

        # Card tokenization, recipient lookups and auth-adjacent routes: tight limits.
        location ~ ^/v1/(rails/card/tokens|wallet/recipients/lookup) {
            limit_req zone=sensitive burst=10 nodelay;
            proxy_pass http://elepay;
            include /etc/nginx/elepay_proxy.conf;
        }

        # Partner callbacks: allow-list the partner ranges here, deny the rest.
        location ~ ^/v1/(rails/[^/]+/callbacks|fx/partners/) {
            # allow <mtn range>; allow <telecel range>; ...
            # deny all;
            proxy_pass http://elepay;
            include /etc/nginx/elepay_proxy.conf;
        }

        # Never expose actuator publicly (prod uses a separate management port anyway).
        location /actuator/ { return 404; }

        location / {
            limit_req zone=per_key burst=200 nodelay;
            proxy_pass http://elepay;
            include /etc/nginx/elepay_proxy.conf;
        }
    }
}
